name: Symbian Level 41 E65 device test

on:
  workflow_dispatch:
  push:
    branches:
      - arena/671096c5-quantum
    paths:
      - '.github/workflows/device-level41-test.yml'
      - 'symbian9/CMakeLists.txt'
      - 'symbian9/device_render_test/CMakeLists.txt'
      - 'symbian9/device_render_test/main.cc'
      - 'symbian9/device_render_test/symbian.toml'
      - 'symbian9/device_render_test/assets/**'
      - 'symbian9/level41_device_test/CMakeLists.txt'
      - 'symbian9/level41_device_test/level41_main.cc'
      - 'symbian9/level41_device_test/symbian.toml'
      - 'symbian9/level41_device_test/assets/level41/**'
      - 'symbian9/level41_launch_probe/**'
      - 'symbian9/level41_no_dsa/**'
      - 'symbian9/level41_service_probe/**'
      - 'symbian9/level41_fs_probe/**'
      - 'symbian9/level41_fs_connect_probe/**'
      - 'symbian9/level41_math_probe/**'
      - 'symbian9/tools/prepare_level41_device_assets.py'
      - 'symbian9/tools/prepare_level41_package.py'
      - 'symbian9/tools/prepare_level41_launch_probe_package.py'
      - 'symbian9/inc/math_utils.h'
      - 'symbian9/inc/math_utils2.h'
      - 'symbian9/inc/matrix.h'
      - 'symbian9/inc/qfps.h'
      - 'symbian9/inc/quantum_integer.h'
      - 'symbian9/inc/quantum_math.h'
      - 'symbian9/inc/quantum_types.h'
      - 'symbian9/inc/render_mode_policy.h'
      - 'symbian9/inc/software_affine_rasterizer.h'
      - 'symbian9/inc/software_mesh_3d_parser.h'
      - 'symbian9/inc/software_mesh_renderer.h'
      - 'symbian9/inc/software_perspective_rasterizer.h'
      - 'symbian9/inc/software_polygon_renderer.h'
      - 'symbian9/inc/software_triangle_renderer.h'
      - 'symbian9/inc/software_vertex_pipeline.h'
      - 'symbian9/inc/vector3d.h'
      - 'symbian9/src/core/math_utils.cpp'
      - 'symbian9/src/core/math_utils2.cpp'
      - 'symbian9/src/core/matrix.cpp'
      - 'symbian9/src/core/qfps.cpp'
      - 'symbian9/src/core/quantum_math.cpp'
      - 'symbian9/src/core/render_mode_policy.cpp'
      - 'symbian9/src/core/software_affine_rasterizer.cpp'
      - 'symbian9/src/core/software_mesh_3d_parser.cpp'
      - 'symbian9/src/core/software_mesh_renderer.cpp'
      - 'symbian9/src/core/software_perspective_rasterizer.cpp'
      - 'symbian9/src/core/software_polygon_renderer.cpp'
      - 'symbian9/src/core/software_triangle_renderer.cpp'
      - 'symbian9/src/core/software_vertex_pipeline.cpp'
      - 'symbian9/src/core/vector3d.cpp'

permissions:
  contents: write

concurrency:
  group: level41-e65-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/arena/671096c5-quantum'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the fixed session branch
        uses: actions/checkout@v4
        with:
          ref: arena/671096c5-quantum

      - name: Set up Python for host tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick zlib1g-dev build-essential perl curl
          python -m venv "$RUNNER_TEMP/symbian-venv"
          echo "$RUNNER_TEMP/symbian-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/symbian-venv/bin/python" -m pip install --disable-pip-version-check symbian-platform==0.3.0

      - name: Download and install the build-only Symbian SDK
        env:
          SDK_ARCHIVE_URL: https://github.com/hpnkv/symbian-platform/releases/download/v0.3.0/symbian-sdk-0.3.0-linux-x86_64.tar.gz
        run: |
          curl --fail --location --retry 3 "$SDK_ARCHIVE_URL" --output "$RUNNER_TEMP/symbian-sdk.tar.gz"
          symbian sdk install "$RUNNER_TEMP/symbian-sdk" --archive "$RUNNER_TEMP/symbian-sdk.tar.gz"

      - name: Configure the Level 41 CMake target
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/symbian-sdk"
          BUILD="$RUNNER_TEMP/quantum-level41-build"
          "$SDK/bin/cmake" \
            -S "$GITHUB_WORKSPACE/symbian9" \
            -B "$BUILD" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$SDK/cmake/symbian-arm.cmake" \
            -DSYMBIAN_SDK_PREFIX="$SDK" \
            -DSYMBIAN_TARGET_ARCH=armv5t \
            -DSYMBIAN_RUNTIME_LEGACY_EKA2=ON \
            -DQUANTUM_BUILD_LEVEL41_DEVICE_TEST=ON \
            -DCMAKE_MAKE_PROGRAM="$SDK/bin/ninja" \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee "$RUNNER_TEMP/level41-cmake-configure.log"

      - name: Build the Level 41 E32 application
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/symbian-sdk"
          BUILD="$RUNNER_TEMP/quantum-level41-build"
          BUILD_LOG="$RUNNER_TEMP/level41-cmake-build.log"
          : > "$BUILD_LOG"
          echo "Building Level 41 app and diagnostic variants in $BUILD"
          if "$SDK/bin/cmake" --build "$BUILD" \
              --target quantum_level41_device_test_e32 quantum_level41_launch_probe_e32 \
                quantum_level41_no_dsa_e32 quantum_level41_service_probe_e32 \
                quantum_level41_fs_probe_e32 quantum_level41_fs_connect_probe_e32 \
                quantum_level41_math_probe_e32 quantum_render_device_test_e32 \
              --parallel 2 --verbose > "$BUILD_LOG" 2>&1; then
            cat "$BUILD_LOG"
          else
            BUILD_STATUS=$?
            cat "$BUILD_LOG"
            BUILD_LOG_BYTES="$(wc -c < "$BUILD_LOG")"
            BUILD_ERRORS="$(grep -oE 'undefined symbol: [[:alnum:]_@.]+|undefined reference to [^[:cntrl:]]{1,180}|ld[.]lld: error: [^[:cntrl:]]{1,180}|fatal error: [^[:cntrl:]]{1,180}|error: [^[:cntrl:]]{1,180}|ninja: error: [^[:cntrl:]]{1,180}' "$BUILD_LOG" | tail -n 20 | tr '\r\n' ' ' | cut -c1-2400 || true)"
            if [ -z "$BUILD_ERRORS" ]; then
              BUILD_ERRORS="$(tail -n 4 "$BUILD_LOG" | tr '\r\n' ' ' | cut -c1-2400)"
            fi
            echo "::error title=Level 41 E32 build::cmake --build exited with status $BUILD_STATUS, log bytes=$BUILD_LOG_BYTES; diagnostics: $BUILD_ERRORS"
            exit "$BUILD_STATUS"
          fi

      - name: Verify the Level 41 E32 artifact
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/quantum-level41-build"
          EXE="$BUILD/level41_device_test/e32/quantum_level41_device_test.exe"
          PROBE_EXE="$BUILD/level41_launch_probe/e32/quantum_level41_launch_probe.exe"
          NO_DSA_EXE="$BUILD/level41_device_test/e32/quantum_level41_no_dsa.exe"
          SERVICE_EXE="$BUILD/level41_service_probe/e32/quantum_level41_service_probe.exe"
          FS_EXE="$BUILD/level41_service_probe/e32/quantum_level41_fs_probe.exe"
          FS_CONNECT_EXE="$BUILD/level41_service_probe/e32/quantum_level41_fs_connect_probe.exe"
          MATH_EXE="$BUILD/level41_service_probe/e32/quantum_level41_math_probe.exe"
          RENDER_EXE="$BUILD/device_render_test/e32/quantum_render_device_test.exe"
          if [ ! -s "$EXE" ]; then
            echo "::error title=Level 41 E32 artifact::Expected output is missing or empty: $EXE"
            exit 1
          fi
          if [ ! -s "$PROBE_EXE" ]; then
            echo "::error title=Level 41 launch-probe artifact::Expected output is missing or empty: $PROBE_EXE"
            exit 1
          fi
          if [ ! -s "$NO_DSA_EXE" ]; then
            echo "::error title=Level 41 GDI-only artifact::Expected output is missing or empty: $NO_DSA_EXE"
            exit 1
          fi
          if [ ! -s "$SERVICE_EXE" ]; then
            echo "::error title=Level 41 service-probe artifact::Expected output is missing or empty: $SERVICE_EXE"
            exit 1
          fi
          if [ ! -s "$FS_EXE" ]; then
            echo "::error title=Level 41 File Server probe artifact::Expected output is missing or empty: $FS_EXE"
            exit 1
          fi
          if [ ! -s "$FS_CONNECT_EXE" ]; then
            echo "::error title=Level 41 RFs Connect probe artifact::Expected output is missing or empty: $FS_CONNECT_EXE"
            exit 1
          fi
          if [ ! -s "$MATH_EXE" ]; then
            echo "::error title=Level 41 math probe artifact::Expected output is missing or empty: $MATH_EXE"
            exit 1
          fi
          if [ ! -s "$RENDER_EXE" ]; then
            echo "::error title=Render probe artifact::Expected output is missing or empty: $RENDER_EXE"
            exit 1
          fi
          symbian inspect --format e32 "$EXE" 2>&1 | tee "$RUNNER_TEMP/level41-e32-inspect.log"
          symbian inspect --format e32 "$PROBE_EXE" 2>&1 | tee "$RUNNER_TEMP/level41-probe-e32-inspect.log"
          symbian inspect --format e32 "$NO_DSA_EXE" 2>&1 | tee "$RUNNER_TEMP/level41-no-dsa-e32-inspect.log"
          symbian inspect --format e32 "$SERVICE_EXE" 2>&1 | tee "$RUNNER_TEMP/level41-service-e32-inspect.log"
          symbian inspect --format e32 "$FS_EXE" 2>&1 | tee "$RUNNER_TEMP/level41-fs-e32-inspect.log"
          symbian inspect --format e32 "$FS_CONNECT_EXE" 2>&1 | tee "$RUNNER_TEMP/level41-fs-connect-e32-inspect.log"
          symbian inspect --format e32 "$MATH_EXE" 2>&1 | tee "$RUNNER_TEMP/level41-math-e32-inspect.log"
          symbian inspect --format e32 "$RENDER_EXE" 2>&1 | tee "$RUNNER_TEMP/render-test-e32-inspect.log"

      - name: Surface Level 41 build diagnostics
        if: failure()
        run: |
          set -euo pipefail
          for log in \
            "$RUNNER_TEMP/level41-cmake-configure.log" \
            "$RUNNER_TEMP/level41-cmake-build.log" \
            "$RUNNER_TEMP/level41-e32-inspect.log" \
            "$RUNNER_TEMP/level41-probe-e32-inspect.log" \
            "$RUNNER_TEMP/level41-no-dsa-e32-inspect.log" \
            "$RUNNER_TEMP/level41-service-e32-inspect.log" \
            "$RUNNER_TEMP/level41-fs-e32-inspect.log" \
            "$RUNNER_TEMP/level41-fs-connect-e32-inspect.log" \
            "$RUNNER_TEMP/level41-math-e32-inspect.log" \
            "$RUNNER_TEMP/render-test-e32-inspect.log" \
            "$RUNNER_TEMP/level41-assets.log" \
            "$RUNNER_TEMP/level41-package-inputs.log" \
            "$RUNNER_TEMP/level41-probe-package-inputs.log" \
            "$RUNNER_TEMP/level41-no-dsa-package-inputs.log" \
            "$RUNNER_TEMP/level41-service-package-inputs.log" \
            "$RUNNER_TEMP/level41-fs-package-inputs.log" \
            "$RUNNER_TEMP/level41-math-package-inputs.log" \
            "$RUNNER_TEMP/level41-fs-connect-package-inputs.log" \
            "$RUNNER_TEMP/render-test-package-inputs.log"; do
            if [ -f "$log" ]; then
              while IFS= read -r line; do
                echo "::error title=Level 41 build diagnostics::$line"
              done < <(tail -n 60 "$log")
            fi
          done

      - name: Prepare compact Level 41 textures
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/quantum-level41-package"
          LOG="$RUNNER_TEMP/level41-assets.log"
          mkdir -p "$PACKAGE"
          if "$RUNNER_TEMP/symbian-venv/bin/python" \
              "$GITHUB_WORKSPACE/symbian9/tools/prepare_level41_device_assets.py" \
              --output "$PACKAGE" > "$LOG" 2>&1; then
            cat "$LOG"
          else
            STATUS=$?
            cat "$LOG"
            DETAILS="$(tail -n 12 "$LOG" | tr '\r\n' ' ' | cut -c1-1800)"
            echo "::error title=Level 41 texture preparation::exit=$STATUS; $DETAILS"
            exit "$STATUS"
          fi

      - name: Prepare Level 41 SIS inputs
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/quantum-level41-package"
          ARTIFACT="$RUNNER_TEMP/quantum-level41-build/level41_device_test/e32/quantum_level41_device_test.exe"
          LOG="$RUNNER_TEMP/level41-package-inputs.log"
          if "$RUNNER_TEMP/symbian-venv/bin/python" \
              "$GITHUB_WORKSPACE/symbian9/tools/prepare_level41_package.py" \
              --project "$GITHUB_WORKSPACE/symbian9/level41_device_test" \
              --artifact "$ARTIFACT" \
              --output "$PACKAGE" > "$LOG" 2>&1; then
            cat "$LOG"
          else
            STATUS=$?
            cat "$LOG"
            DETAILS="$(tail -n 16 "$LOG" | tr '\r\n' ' ' | cut -c1-2200)"
            echo "::error title=Level 41 SIS input preparation::exit=$STATUS; $DETAILS"
            exit "$STATUS"
          fi
          test -s "$PACKAGE/quantum_level41_device_test.pkg"

      - name: Prepare minimal launch-probe SIS inputs
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/quantum-level41-probe-package"
          ARTIFACT="$RUNNER_TEMP/quantum-level41-build/level41_launch_probe/e32/quantum_level41_launch_probe.exe"
          LOG="$RUNNER_TEMP/level41-probe-package-inputs.log"
          mkdir -p "$PACKAGE"
          if "$RUNNER_TEMP/symbian-venv/bin/python" \
              "$GITHUB_WORKSPACE/symbian9/tools/prepare_level41_launch_probe_package.py" \
              --project "$GITHUB_WORKSPACE/symbian9/level41_launch_probe" \
              --artifact "$ARTIFACT" \
              --output "$PACKAGE" > "$LOG" 2>&1; then
            cat "$LOG"
          else
            STATUS=$?
            cat "$LOG"
            DETAILS="$(tail -n 16 "$LOG" | tr '\\r\\n' ' ' | cut -c1-2200)"
            echo "::error title=Level 41 launch-probe SIS input preparation::exit=$STATUS; $DETAILS"
            exit "$STATUS"
          fi
          test -s "$PACKAGE/quantum_level41_launch_probe.pkg"

      - name: Prepare render-test SIS inputs
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/quantum-render-test-package"
          ARTIFACT="$RUNNER_TEMP/quantum-level41-build/device_render_test/e32/quantum_render_device_test.exe"
          LOG="$RUNNER_TEMP/render-test-package-inputs.log"
          mkdir -p "$PACKAGE"
          if "$RUNNER_TEMP/symbian-venv/bin/python" \
              "$GITHUB_WORKSPACE/symbian9/tools/prepare_level41_launch_probe_package.py" \
              --project "$GITHUB_WORKSPACE/symbian9/device_render_test" \
              --artifact "$ARTIFACT" \
              --output "$PACKAGE" > "$LOG" 2>&1; then
            cat "$LOG"
          else
            STATUS=$?
            cat "$LOG"
            DETAILS="$(tail -n 16 "$LOG" | tr '\\r\\n' ' ' | cut -c1-2200)"
            echo "::error title=Render-test SIS input preparation::exit=$STATUS; $DETAILS"
            exit "$STATUS"
          fi
          test -s "$PACKAGE/quantum_render_device_test.pkg"

      - name: Prepare GDI-only Level 41 SIS inputs
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/quantum-level41-no-dsa-package"
          ARTIFACT="$RUNNER_TEMP/quantum-level41-build/level41_device_test/e32/quantum_level41_no_dsa.exe"
          LOG="$RUNNER_TEMP/level41-no-dsa-package-inputs.log"
          mkdir -p "$PACKAGE"
          if "$RUNNER_TEMP/symbian-venv/bin/python" \
              "$GITHUB_WORKSPACE/symbian9/tools/prepare_level41_launch_probe_package.py" \
              --project "$GITHUB_WORKSPACE/symbian9/level41_no_dsa" \
              --artifact "$ARTIFACT" \
              --output "$PACKAGE" > "$LOG" 2>&1; then
            cat "$LOG"
          else
            STATUS=$?
            cat "$LOG"
            DETAILS="$(tail -n 16 "$LOG" | tr '\\r\\n' ' ' | cut -c1-2200)"
            echo "::error title=Level 41 GDI-only SIS input preparation::exit=$STATUS; $DETAILS"
            exit "$STATUS"
          fi
          test -s "$PACKAGE/quantum_level41_no_dsa.pkg"

      - name: Prepare File Server and math probe SIS inputs
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/quantum-level41-service-package"
          ARTIFACT="$RUNNER_TEMP/quantum-level41-build/level41_service_probe/e32/quantum_level41_service_probe.exe"
          LOG="$RUNNER_TEMP/level41-service-package-inputs.log"
          mkdir -p "$PACKAGE"
          if "$RUNNER_TEMP/symbian-venv/bin/python" \
              "$GITHUB_WORKSPACE/symbian9/tools/prepare_level41_launch_probe_package.py" \
              --project "$GITHUB_WORKSPACE/symbian9/level41_service_probe" \
              --artifact "$ARTIFACT" \
              --output "$PACKAGE" > "$LOG" 2>&1; then
            cat "$LOG"
          else
            STATUS=$?
            cat "$LOG"
            DETAILS="$(tail -n 16 "$LOG" | tr '\\r\\n' ' ' | cut -c1-2200)"
            echo "::error title=Level 41 service-probe SIS input preparation::exit=$STATUS; $DETAILS"
            exit "$STATUS"
          fi
          test -s "$PACKAGE/quantum_level41_service_probe.pkg"

      - name: Prepare File Server-only probe SIS inputs
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/quantum-level41-fs-package"
          ARTIFACT="$RUNNER_TEMP/quantum-level41-build/level41_service_probe/e32/quantum_level41_fs_probe.exe"
          LOG="$RUNNER_TEMP/level41-fs-package-inputs.log"
          mkdir -p "$PACKAGE"
          if "$RUNNER_TEMP/symbian-venv/bin/python" \
              "$GITHUB_WORKSPACE/symbian9/tools/prepare_level41_launch_probe_package.py" \
              --project "$GITHUB_WORKSPACE/symbian9/level41_fs_probe" \
              --artifact "$ARTIFACT" \
              --output "$PACKAGE" > "$LOG" 2>&1; then
            cat "$LOG"
          else
            STATUS=$?
            cat "$LOG"
            DETAILS="$(tail -n 16 "$LOG" | tr '\\r\\n' ' ' | cut -c1-2200)"
            echo "::error title=Level 41 File Server probe SIS input preparation::exit=$STATUS; $DETAILS"
            exit "$STATUS"
          fi
          test -s "$PACKAGE/quantum_level41_fs_probe.pkg"

      - name: Prepare Math-only probe SIS inputs
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/quantum-level41-math-package"
          ARTIFACT="$RUNNER_TEMP/quantum-level41-build/level41_service_probe/e32/quantum_level41_math_probe.exe"
          LOG="$RUNNER_TEMP/level41-math-package-inputs.log"
          mkdir -p "$PACKAGE"
          if "$RUNNER_TEMP/symbian-venv/bin/python" \
              "$GITHUB_WORKSPACE/symbian9/tools/prepare_level41_launch_probe_package.py" \
              --project "$GITHUB_WORKSPACE/symbian9/level41_math_probe" \
              --artifact "$ARTIFACT" \
              --output "$PACKAGE" > "$LOG" 2>&1; then
            cat "$LOG"
          else
            STATUS=$?
            cat "$LOG"
            DETAILS="$(tail -n 16 "$LOG" | tr '\\r\\n' ' ' | cut -c1-2200)"
            echo "::error title=Level 41 Math probe SIS input preparation::exit=$STATUS; $DETAILS"
            exit "$STATUS"
          fi
          test -s "$PACKAGE/quantum_level41_math_probe.pkg"

      - name: Prepare deferred RFs Connect probe SIS inputs
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/quantum-level41-fs-connect-package"
          ARTIFACT="$RUNNER_TEMP/quantum-level41-build/level41_service_probe/e32/quantum_level41_fs_connect_probe.exe"
          LOG="$RUNNER_TEMP/level41-fs-connect-package-inputs.log"
          mkdir -p "$PACKAGE"
          if "$RUNNER_TEMP/symbian-venv/bin/python" \
              "$GITHUB_WORKSPACE/symbian9/tools/prepare_level41_launch_probe_package.py" \
              --project "$GITHUB_WORKSPACE/symbian9/level41_fs_connect_probe" \
              --artifact "$ARTIFACT" \
              --output "$PACKAGE" > "$LOG" 2>&1; then
            cat "$LOG"
          else
            STATUS=$?
            cat "$LOG"
            DETAILS="$(tail -n 16 "$LOG" | tr '\\r\\n' ' ' | cut -c1-2200)"
            echo "::error title=Level 41 RFs Connect probe SIS input preparation::exit=$STATUS; $DETAILS"
            exit "$STATUS"
          fi
          test -s "$PACKAGE/quantum_level41_fs_connect_probe.pkg"

      - name: Build the legacy SIS v9 packer
        run: |
          set -euo pipefail
          OPENSSL_SRC="$RUNNER_TEMP/openssl-1.0.2u-src"
          OPENSSL_PREFIX="$RUNNER_TEMP/openssl-1.0.2u"
          PACKER_SRC="$RUNNER_TEMP/gnupoc-package"
          LOG="$RUNNER_TEMP/level41-packer.log"
          COMMAND_LOG="$RUNNER_TEMP/level41-packer-command.log"
          : > "$LOG"
          run_logged() {
            DESCRIPTION="$1"
            shift
            echo "=== $DESCRIPTION ==="
            if "$@" > "$COMMAND_LOG" 2>&1; then
              cat "$COMMAND_LOG" >> "$LOG"
              tail -n 12 "$COMMAND_LOG"
            else
              STATUS=$?
              cat "$COMMAND_LOG" >> "$LOG"
              tail -n 40 "$COMMAND_LOG"
              DETAILS="$(tail -n 18 "$COMMAND_LOG" | tr '\r\n' ' ' | cut -c1-2200)"
              echo "::error title=Level 41 SIS packer::$DESCRIPTION failed exit=$STATUS; $DETAILS"
              exit "$STATUS"
            fi
          }

          run_logged "Download OpenSSL 1.0.2u" curl --fail --location --retry 3 \
            https://codeload.github.com/openssl/openssl/tar.gz/refs/tags/OpenSSL_1_0_2u \
            --output "$RUNNER_TEMP/openssl-1.0.2u.tar.gz"
          mkdir -p "$OPENSSL_SRC"
          run_logged "Extract OpenSSL source" tar -xzf "$RUNNER_TEMP/openssl-1.0.2u.tar.gz" \
            --strip-components=1 -C "$OPENSSL_SRC"
          cd "$OPENSSL_SRC"
          run_logged "Configure OpenSSL 1.0.2u" ./config no-shared no-ssl2 no-ssl3 \
            --prefix="$OPENSSL_PREFIX"
          run_logged "Generate OpenSSL dependencies" make depend
          run_logged "Build OpenSSL libraries and utilities" make --jobs=2 build_apps
          run_logged "Install OpenSSL libraries" make install_sw

          run_logged "Download GnuPoc MakeSIS source" curl --fail --location --retry 3 \
            https://codeload.github.com/mstorsjo/gnupoc-package/tar.gz/d3ddaf58c734ad3ab34dc60a012f9d4768a9ed3e \
            --output "$RUNNER_TEMP/gnupoc-package.tar.gz"
          mkdir -p "$PACKER_SRC"
          run_logged "Extract GnuPoc MakeSIS source" tar -xzf "$RUNNER_TEMP/gnupoc-package.tar.gz" \
            --strip-components=1 -C "$PACKER_SRC"
          cd "$PACKER_SRC/tools/makesis-4/src"
          SIS_DIAGNOSTIC_CFLAGS="-Wall -I../include -I$OPENSSL_PREFIX/include -O1 -g -fsanitize=address -fno-omit-frame-pointer -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"
          SIS_DIAGNOSTIC_LDFLAGS="-fsanitize=address"
          run_logged "Build MakeSIS with AddressSanitizer" make --jobs=2 \
            CFLAGS="$SIS_DIAGNOSTIC_CFLAGS" \
            LDFLAGS="$SIS_DIAGNOSTIC_LDFLAGS" \
            LIBS="-L$OPENSSL_PREFIX/lib -lcrypto -lz"
          run_logged "Build SIS utility tools" make --jobs=2 devtools \
            CFLAGS="$SIS_DIAGNOSTIC_CFLAGS" \
            LDFLAGS="$SIS_DIAGNOSTIC_LDFLAGS" \
            LIBS="-L$OPENSSL_PREFIX/lib -lcrypto -lz"
          echo "SIS_PACKER=$PACKER_SRC/tools/makesis-4/src" >> "$GITHUB_ENV"
          echo "OPENSSL_PREFIX=$OPENSSL_PREFIX" >> "$GITHUB_ENV"

      - name: Create and verify the E65 SISX candidate
        run: |
          set -euo pipefail
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          PACKAGE="$RUNNER_TEMP/quantum-level41-package"
          PACKER="$SIS_PACKER"
          CERT_DIR="$RUNNER_TEMP/level41-signing"
          COMMAND_LOG="$RUNNER_TEMP/level41-sis-command.log"
          mkdir -p "$CERT_DIR/newcerts"
          touch "$CERT_DIR/index.txt"
          printf '1000\n' > "$CERT_DIR/serial"
          cat > "$CERT_DIR/openssl.cnf" <<EOF
          [ ca ]
          default_ca = local_ca
          [ local_ca ]
          database = $CERT_DIR/index.txt
          new_certs_dir = $CERT_DIR/newcerts
          serial = $CERT_DIR/serial
          default_md = sha1
          policy = policy_any
          x509_extensions = device_signing
          [ policy_any ]
          countryName = optional
          stateOrProvinceName = optional
          localityName = optional
          organizationName = optional
          organizationalUnitName = optional
          commonName = supplied
          emailAddress = optional
          [ device_signing ]
          basicConstraints = critical,CA:FALSE
          keyUsage = critical,digitalSignature
          EOF
          run_logged() {
            DESCRIPTION="$1"
            shift
            echo "=== $DESCRIPTION ==="
            if "$@" > "$COMMAND_LOG" 2>&1; then
              tail -n 12 "$COMMAND_LOG"
            else
              STATUS=$?
              tail -n 40 "$COMMAND_LOG"
              DETAILS="$(tail -n 18 "$COMMAND_LOG" | tr '\r\n' ' ' | cut -c1-2200)"
              echo "::error title=Level 41 SISX candidate::$DESCRIPTION failed exit=$STATUS; $DETAILS"
              exit "$STATUS"
            fi
          }
          run_logged "Generate device signing request" openssl req -new -newkey rsa:1024 -sha1 -nodes \
            -keyout "$CERT_DIR/level41.key" \
            -out "$CERT_DIR/level41.csr" \
            -subj '/C=KG/O=Quantum native port/CN=Quantum Level 41 Test'
          run_logged "Self-sign E65 test certificate" openssl ca -selfsign -batch -notext -preserveDN \
            -config "$CERT_DIR/openssl.cnf" \
            -keyfile "$CERT_DIR/level41.key" \
            -in "$CERT_DIR/level41.csr" \
            -out "$CERT_DIR/level41.cer" \
            -startdate 20000101000000Z -enddate 20451231235959Z \
            -md sha1 -extensions device_signing
          run_logged "Inspect signing certificate" openssl x509 -in "$CERT_DIR/level41.cer" -noout -dates

          cd "$PACKAGE"
          run_logged "Trace MakeSIS package creation" env \
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
            "$PACKER/makesis" -v \
            quantum_level41_device_test.pkg quantum_level41_device_test.sis
          run_logged "Sign SIS archive" "$PACKER/signsis" quantum_level41_device_test.sis \
            quantum_level41_device_test-e65-candidate.sisx \
            "$CERT_DIR/level41.cer" "$CERT_DIR/level41.key"
          run_logged "Verify signed SISX" "$PACKER/signsis" -o quantum_level41_device_test-e65-candidate.sisx
          run_logged "Inspect SISX file tree" "$PACKER/dumptree" \
            quantum_level41_device_test-e65-candidate.sisx
          cp "$COMMAND_LOG" "$RUNNER_TEMP/level41-sis-tree.txt"
          test -s quantum_level41_device_test-e65-candidate.sisx
          stat -c '%n %s bytes' quantum_level41_device_test-e65-candidate.sisx
          sha256sum quantum_level41_device_test-e65-candidate.sisx

          PROBE_PACKAGE="$RUNNER_TEMP/quantum-level41-probe-package"
          cd "$PROBE_PACKAGE"
          run_logged "Trace MakeSIS launch-probe package creation" env \
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
            "$PACKER/makesis" -v \
            quantum_level41_launch_probe.pkg quantum_level41_launch_probe.sis
          run_logged "Sign launch-probe SIS archive" "$PACKER/signsis" \
            quantum_level41_launch_probe.sis \
            quantum_level41_launch_probe-e65-candidate.sisx \
            "$CERT_DIR/level41.cer" "$CERT_DIR/level41.key"
          run_logged "Verify signed launch-probe SISX" "$PACKER/signsis" -o \
            quantum_level41_launch_probe-e65-candidate.sisx
          run_logged "Inspect launch-probe SISX file tree" "$PACKER/dumptree" \
            quantum_level41_launch_probe-e65-candidate.sisx
          cp "$COMMAND_LOG" "$RUNNER_TEMP/level41-probe-sis-tree.txt"
          test -s quantum_level41_launch_probe-e65-candidate.sisx
          stat -c '%n %s bytes' quantum_level41_launch_probe-e65-candidate.sisx
          sha256sum quantum_level41_launch_probe-e65-candidate.sisx

          NO_DSA_PACKAGE="$RUNNER_TEMP/quantum-level41-no-dsa-package"
          cd "$NO_DSA_PACKAGE"
          run_logged "Trace MakeSIS GDI-only Level 41 package creation" env \
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
            "$PACKER/makesis" -v \
            quantum_level41_no_dsa.pkg quantum_level41_no_dsa.sis
          run_logged "Sign GDI-only Level 41 SIS archive" "$PACKER/signsis" \
            quantum_level41_no_dsa.sis \
            quantum_level41_no_dsa-e65-candidate.sisx \
            "$CERT_DIR/level41.cer" "$CERT_DIR/level41.key"
          run_logged "Verify signed GDI-only Level 41 SISX" "$PACKER/signsis" -o \
            quantum_level41_no_dsa-e65-candidate.sisx
          run_logged "Inspect GDI-only Level 41 SISX file tree" "$PACKER/dumptree" \
            quantum_level41_no_dsa-e65-candidate.sisx
          cp "$COMMAND_LOG" "$RUNNER_TEMP/level41-no-dsa-sis-tree.txt"
          test -s quantum_level41_no_dsa-e65-candidate.sisx
          stat -c '%n %s bytes' quantum_level41_no_dsa-e65-candidate.sisx
          sha256sum quantum_level41_no_dsa-e65-candidate.sisx

          SERVICE_PACKAGE="$RUNNER_TEMP/quantum-level41-service-package"
          cd "$SERVICE_PACKAGE"
          run_logged "Trace MakeSIS service-probe package creation" env \
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
            "$PACKER/makesis" -v \
            quantum_level41_service_probe.pkg quantum_level41_service_probe.sis
          run_logged "Sign service-probe SIS archive" "$PACKER/signsis" \
            quantum_level41_service_probe.sis \
            quantum_level41_service_probe-e65-candidate.sisx \
            "$CERT_DIR/level41.cer" "$CERT_DIR/level41.key"
          run_logged "Verify signed service-probe SISX" "$PACKER/signsis" -o \
            quantum_level41_service_probe-e65-candidate.sisx
          run_logged "Inspect service-probe SISX file tree" "$PACKER/dumptree" \
            quantum_level41_service_probe-e65-candidate.sisx
          cp "$COMMAND_LOG" "$RUNNER_TEMP/level41-service-sis-tree.txt"
          test -s quantum_level41_service_probe-e65-candidate.sisx
          stat -c '%n %s bytes' quantum_level41_service_probe-e65-candidate.sisx
          sha256sum quantum_level41_service_probe-e65-candidate.sisx

          FS_PACKAGE="$RUNNER_TEMP/quantum-level41-fs-package"
          cd "$FS_PACKAGE"
          run_logged "Trace MakeSIS File Server probe package creation" env \
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
            "$PACKER/makesis" -v \
            quantum_level41_fs_probe.pkg quantum_level41_fs_probe.sis
          run_logged "Sign File Server probe SIS archive" "$PACKER/signsis" \
            quantum_level41_fs_probe.sis \
            quantum_level41_fs_probe-e65-candidate.sisx \
            "$CERT_DIR/level41.cer" "$CERT_DIR/level41.key"
          run_logged "Verify signed File Server probe SISX" "$PACKER/signsis" -o \
            quantum_level41_fs_probe-e65-candidate.sisx
          run_logged "Inspect File Server probe SISX file tree" "$PACKER/dumptree" \
            quantum_level41_fs_probe-e65-candidate.sisx
          cp "$COMMAND_LOG" "$RUNNER_TEMP/level41-fs-sis-tree.txt"
          test -s quantum_level41_fs_probe-e65-candidate.sisx
          stat -c '%n %s bytes' quantum_level41_fs_probe-e65-candidate.sisx
          sha256sum quantum_level41_fs_probe-e65-candidate.sisx

          MATH_PACKAGE="$RUNNER_TEMP/quantum-level41-math-package"
          cd "$MATH_PACKAGE"
          run_logged "Trace MakeSIS Math-only probe package creation" env \
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
            "$PACKER/makesis" -v \
            quantum_level41_math_probe.pkg quantum_level41_math_probe.sis
          run_logged "Sign Math-only probe SIS archive" "$PACKER/signsis" \
            quantum_level41_math_probe.sis \
            quantum_level41_math_probe-e65-candidate.sisx \
            "$CERT_DIR/level41.cer" "$CERT_DIR/level41.key"
          run_logged "Verify signed Math-only probe SISX" "$PACKER/signsis" -o \
            quantum_level41_math_probe-e65-candidate.sisx
          run_logged "Inspect Math-only probe SISX file tree" "$PACKER/dumptree" \
            quantum_level41_math_probe-e65-candidate.sisx
          cp "$COMMAND_LOG" "$RUNNER_TEMP/level41-math-sis-tree.txt"
          test -s quantum_level41_math_probe-e65-candidate.sisx
          stat -c '%n %s bytes' quantum_level41_math_probe-e65-candidate.sisx
          sha256sum quantum_level41_math_probe-e65-candidate.sisx

          RENDER_PACKAGE="$RUNNER_TEMP/quantum-render-test-package"
          cd "$RENDER_PACKAGE"
          run_logged "Trace MakeSIS render-test package creation" env \
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
            "$PACKER/makesis" -v \
            quantum_render_device_test.pkg quantum_render_device_test.sis
          run_logged "Sign render-test SIS archive" "$PACKER/signsis" \
            quantum_render_device_test.sis \
            quantum_render_device_test-e65-candidate.sisx \
            "$CERT_DIR/level41.cer" "$CERT_DIR/level41.key"
          run_logged "Verify signed render-test SISX" "$PACKER/signsis" -o \
            quantum_render_device_test-e65-candidate.sisx
          run_logged "Inspect render-test SISX file tree" "$PACKER/dumptree" \
            quantum_render_device_test-e65-candidate.sisx
          cp "$COMMAND_LOG" "$RUNNER_TEMP/render-test-sis-tree.txt"
          test -s quantum_render_device_test-e65-candidate.sisx
          stat -c '%n %s bytes' quantum_render_device_test-e65-candidate.sisx
          sha256sum quantum_render_device_test-e65-candidate.sisx

          FS_CONNECT_PACKAGE="$RUNNER_TEMP/quantum-level41-fs-connect-package"
          cd "$FS_CONNECT_PACKAGE"
          run_logged "Trace MakeSIS RFs Connect probe package creation" env \
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
            "$PACKER/makesis" -v \
            quantum_level41_fs_connect_probe.pkg quantum_level41_fs_connect_probe.sis
          run_logged "Sign RFs Connect probe SIS archive" "$PACKER/signsis" \
            quantum_level41_fs_connect_probe.sis \
            quantum_level41_fs_connect_probe-e65-candidate.sisx \
            "$CERT_DIR/level41.cer" "$CERT_DIR/level41.key"
          run_logged "Verify signed RFs Connect probe SISX" "$PACKER/signsis" -o \
            quantum_level41_fs_connect_probe-e65-candidate.sisx
          run_logged "Inspect RFs Connect probe SISX file tree" "$PACKER/dumptree" \
            quantum_level41_fs_connect_probe-e65-candidate.sisx
          cp "$COMMAND_LOG" "$RUNNER_TEMP/level41-fs-connect-sis-tree.txt"
          test -s quantum_level41_fs_connect_probe-e65-candidate.sisx
          stat -c '%n %s bytes' quantum_level41_fs_connect_probe-e65-candidate.sisx
          sha256sum quantum_level41_fs_connect_probe-e65-candidate.sisx

      - name: Publish the build-verified SISX candidate to the fixed branch
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/quantum-level41-package/quantum_level41_device_test-e65-candidate.sisx" \
            "$GITHUB_WORKSPACE/symbian9/level41_device_test/quantum_level41_device_test-e65-candidate.sisx"
          cp "$RUNNER_TEMP/quantum-render-test-package/quantum_render_device_test-e65-candidate.sisx" \
            "$GITHUB_WORKSPACE/symbian9/device_render_test/quantum_render_device_test-e65-candidate.sisx"
          cp "$RUNNER_TEMP/quantum-level41-probe-package/quantum_level41_launch_probe-e65-candidate.sisx" \
            "$GITHUB_WORKSPACE/symbian9/level41_launch_probe/quantum_level41_launch_probe-e65-candidate.sisx"
          cp "$RUNNER_TEMP/quantum-level41-no-dsa-package/quantum_level41_no_dsa-e65-candidate.sisx" \
            "$GITHUB_WORKSPACE/symbian9/level41_no_dsa/quantum_level41_no_dsa-e65-candidate.sisx"
          cp "$RUNNER_TEMP/quantum-level41-service-package/quantum_level41_service_probe-e65-candidate.sisx" \
            "$GITHUB_WORKSPACE/symbian9/level41_service_probe/quantum_level41_service_probe-e65-candidate.sisx"
          cp "$RUNNER_TEMP/quantum-level41-fs-package/quantum_level41_fs_probe-e65-candidate.sisx" \
            "$GITHUB_WORKSPACE/symbian9/level41_fs_probe/quantum_level41_fs_probe-e65-candidate.sisx"
          cp "$RUNNER_TEMP/quantum-level41-fs-connect-package/quantum_level41_fs_connect_probe-e65-candidate.sisx" \
            "$GITHUB_WORKSPACE/symbian9/level41_fs_connect_probe/quantum_level41_fs_connect_probe-e65-candidate.sisx"
          cp "$RUNNER_TEMP/quantum-level41-math-package/quantum_level41_math_probe-e65-candidate.sisx" \
            "$GITHUB_WORKSPACE/symbian9/level41_math_probe/quantum_level41_math_probe-e65-candidate.sisx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            symbian9/level41_device_test/quantum_level41_device_test-e65-candidate.sisx \
            symbian9/device_render_test/quantum_render_device_test-e65-candidate.sisx \
            symbian9/level41_launch_probe/quantum_level41_launch_probe-e65-candidate.sisx \
            symbian9/level41_no_dsa/quantum_level41_no_dsa-e65-candidate.sisx \
            symbian9/level41_service_probe/quantum_level41_service_probe-e65-candidate.sisx \
            symbian9/level41_fs_probe/quantum_level41_fs_probe-e65-candidate.sisx \
            symbian9/level41_fs_connect_probe/quantum_level41_fs_connect_probe-e65-candidate.sisx \
            symbian9/level41_math_probe/quantum_level41_math_probe-e65-candidate.sisx
          if git diff --cached --quiet; then
            echo "No SISX change to publish."
          else
            git commit -m "Publish Level 41 E65 SISX candidate"
            git push origin HEAD:refs/heads/arena/671096c5-quantum
          fi
