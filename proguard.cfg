# ProGuard configuration for Quantum Kordos-Full (M3G-only render path)
# Shrink only — no obfuscation, no optimization.
# Apply: java -jar proguard.jar @proguard.cfg

# ----------------------------------------------------------------
# 1. Keep everything reachable from the MIDlet entry point
# ----------------------------------------------------------------
-keep class code.utils.Main { *; }
-keep class * implements javax.microedition.midlet.MIDlet { *; }

# ----------------------------------------------------------------
# 2. Keep classes instantiated reflectively (Class.forName)
#    DirectX7 loads the scene renderer via:
#      Class.forName("code.Rendering.M3GSceneRenderer").newInstance()
# ----------------------------------------------------------------
-keep class code.Rendering.M3GSceneRenderer { *; }
-keep class code.Rendering.SceneRenderer { *; }

# ----------------------------------------------------------------
# 3. Keep JSR-184 (M3G) API classes — ProGuard may not see them
#    on the classpath, so protect them from pruning.
# ----------------------------------------------------------------
-keep class javax.microedition.m3g.* { *; }
-keep interface javax.microedition.m3g.* { *; }

# ----------------------------------------------------------------
# 4. Keep classes that register themselves via Vector/Hashtable
#    (polygon modes, texture cache, etc.)
# ----------------------------------------------------------------
-keep class code.Rendering.PolygonMode { *; }
-keep class code.Rendering.M3GPolygonBatch { *; }
-keep class code.Rendering.M3GPolygonBatch$State { *; }

# ----------------------------------------------------------------
# 4b. Keep SpeedTest benchmark + DirectX7.speedTest field
#    (benchmark is invoked via DeveloperMenu -> DirectX7.current.runSpeedTest)
# ----------------------------------------------------------------
-keep class code.Rendering.SpeedTest { *; }
-keep class code.Rendering.DirectX7 {
    public code.Rendering.SpeedTest speedTest;
    public static code.Rendering.DirectX7 current;
    public void runSpeedTest(int);
}

# ----------------------------------------------------------------
# 5. Shrink: remove unused classes, fields, methods (on by default;
#    -dontshrink would disable it)
#    -printusage пишет список удалённого в build/usage.txt
# ----------------------------------------------------------------
-printusage build/usage.txt
-printseeds build/seeds.txt

# ----------------------------------------------------------------
# 6. No obfuscation, no optimization (keep readable class names)
# ----------------------------------------------------------------
-dontobfuscate
-dontoptimize
-ignorewarnings
-dontusemixedcaseclassnames
-dontskipnonpubliclibraryclasses

# ----------------------------------------------------------------
# 7. Keep library classes verbatim (they are not shrinked anyway,
#    but explicit for clarity)
# ----------------------------------------------------------------
-libraryjars build/sdk/lib/cldc11.jar
-libraryjars build/sdk/lib/midp21.jar
-libraryjars build/sdk/lib/jsr184.jar

# ----------------------------------------------------------------
# 8. Input / output
# ----------------------------------------------------------------
-injars build/classes
-outjars build/shrunk.jar